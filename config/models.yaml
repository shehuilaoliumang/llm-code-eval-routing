# 模型档案配置（数据层）——与路由 Skill references/model-registry.md 同步
# 价格单位：元/百万 Token
# 价格来源：2026-10-17 阿里云百炼 DashScope /api/v1/models 接口实测（含阶梯/缓存/Batch价）；
#           方舟侧价格来自官方定价页快照（2026-10-16），待方舟 key 到位后以同方式核验
version: "0.3"
snapshot_date: "2026-10-17"
price_source: "aliyun_api_verified_2026-10-17 + volcengine_docs_2026-10-16"

platforms:
  volcengine:
    display: "火山方舟"
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    api_key_env: "VOLCENGINE_API_KEY"
    protocol: "openai_compatible"
  aliyun:
    display: "阿里云百炼"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key_env: "DASHSCOPE_API_KEY"
    protocol: "openai_compatible"

# 参评模型（candidate）与裁判模型（judge / judge_default）
models:
  # ---------- T0 旗舰级 ----------
  doubao-seed-2.1-pro:
    platform: volcengine
    tier: T0
    role: candidate
    snapshot: "doubao-seed-2.1-pro-0915"   # 以控制台接入点绑定版本为准
    context_window: 1048576
    verified: false                        # 价格来自文档快照，待方舟key核验
    pricing:
      - {upto_input: 32768, input: 6.0, output: 30.0}
    cache_hit: 1.2

  qwen3.8-max:
    platform: aliyun
    tier: T0
    role: candidate
    snapshot: "qwen3.8-max-0902"
    context_window: 1000000
    verified: true                         # API 实测
    pricing:
      - {upto_input: 1000000, input: 12.0, output: 36.0}   # 限时折扣以控制台为准
    cache_hit: 1.5                         # API 实测（原快照 2.4 有误）
    batch_price: {input: 6.0, output: 18.0}
    disable_thinking_body:
      chat_template_kwargs:
        enable_thinking: false

  # ---------- T1 代码专项级 ----------
  # 注：qwen3-coder-plus 已退役（不在账号模型列表）；继任 qwen3-coder-flash（API实测价格）
  qwen3-coder-flash:
    platform: aliyun
    tier: T1
    role: candidate
    snapshot: "qwen3-coder-flash"
    context_window: 1000000
    max_output_tokens: 65536
    verified: true                         # API 实测
    pricing:
      - {upto_input: 32768, input: 1.0, output: 4.0}
      - {upto_input: 131072, input: 1.5, output: 6.0}
      - {upto_input: 262144, input: 2.5, output: 10.0}
      - {upto_input: 1000000, input: 5.0, output: 25.0}
    cache_hit: 0.2
    disable_thinking_body:
      chat_template_kwargs:
        enable_thinking: false
    note: "qwen3-coder-plus 退役后的代码专项继任；价格为旗舰的 1/12，T1经济性更强"

  doubao-seed-evolving:
    platform: volcengine
    tier: T1
    role: candidate
    snapshot: "doubao-seed-evolving-0915"
    context_window: 1048576
    verified: false                        # doubao-seed-code 下线后的继任候选，价格待核实
    pricing:
      - {upto_input: 32768, input: 6.0, output: 30.0}
    cache_hit: 1.2
    note: "Coding & Agent 场景定位；与旗舰同价，用于隔离模型专项化效应"

  # ---------- T2 均衡性价比级 ----------
