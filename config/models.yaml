      - {upto_input: 32768, input: 9.0, output: 27.0}
    note: "主力裁判 + 10%交叉验证；百炼亦托管此模型（12/24）"

  deepseek-v4-flash:
    platform: volcengine
    role: judge_default
    context_window: 1048576
    verified: false                        # 方舟价 3/9 待核验（百炼无此型号）
    pricing:
      - {upto_input: 32768, input: 3.0, output: 9.0}
