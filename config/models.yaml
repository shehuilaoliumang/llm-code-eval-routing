# 模型档案配置（数据层）——与路由 Skill references/model-registry.md 同步
# 价格单位：元/百万 Token
# 价格来源：2026-10-17 双平台 Key 实测
#   - 百炼：DashScope /api/v1/models API（含阶梯/缓存/Batch价）
#   - 方舟：账号 models.list 实测可用性 + 官方定价页 volcengine.com/docs/82379/1544106
# 关键实测结论：双平台模型均默认开启思考链（不关时 max_tokens 被无视、输出 3~10 倍），
#   全部模型必须显式关闭：方舟 thinking:{type:disabled}；百炼 chat_template_kwargs.enable_thinking=false
version: "0.4"
snapshot_date: "2026-10-17"
price_source: "dual_platform_key_verified_2026-10-17"

platforms:
  volcengine:
    display: "火山方舟"
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    api_key_env: "VOLCENGINE_API_KEY"
    protocol: "openai_compatible"
  aliyun:
    display: "阿里云百炼"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key_env: "DASHSCOPE_API_KEY"
    protocol: "openai_compatible"
  deepseek:
    display: "DeepSeek 官方"
    base_url: "https://api.deepseek.com"
    api_key_env: "DEEPSEEK_API_KEY"
    protocol: "openai_compatible"
    status: "ready_key_pending"             # 用户已表示可提供 Key；到位后在 .env 配置即可启用

# 方舟模型调用必须以精确版本 ID（models.list 实测）；plain name 报 InvalidEndpointOrModel.NotFound
# enabled=false 表示账号未开通（控制台激活后可改 true）

models:
  # ---------- T0 旗舰级 ----------
  doubao-seed-2.1-pro:
    platform: volcengine
    tier: T0
    role: candidate
    enabled: false                        # 账号未开通：控制台激活后置 true
    access_status: "needs_activation"     # 404 InvalidEndpointOrModel.NotFound
    snapshot: "doubao-seed-2.1-pro-260915"
    context_window: 1048576
    verified: true                        # 价格经官方定价页核实（2026-10-17）
    pricing:
      - {upto_input: 32768, input: 6.0, output: 30.0}
    cache_hit: 1.2
    disable_thinking_body:
      thinking:
        type: disabled
    note: "方舟旗舰；方舟侧质量基线。需控制台开通后参与评测"

  qwen3.8-max:
    platform: aliyun
    tier: T0
    role: candidate
    snapshot: "qwen3.8-max-0902"
    context_window: 1000000
    verified: true                         # API 实测
    pricing:
      - {upto_input: 1000000, input: 12.0, output: 36.0}   # 限时折扣以控制台为准
    cache_hit: 1.5                         # API 实测（原快照 2.4 有误）
    batch_price: {input: 6.0, output: 18.0}
    disable_thinking_body:
