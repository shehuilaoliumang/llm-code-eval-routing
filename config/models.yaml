# 模型档案配置（数据层）——与路由 Skill references/model-registry.md 同步
# 价格单位：元/百万 Token；快照日期 2026-10-16
# verified: false 的价格为待控制台核实估计值（evolving/lite/v4.1-flash 为下线模型继任候选）
version: "0.2"
snapshot_date: "2026-10-16"

platforms:
  volcengine:
    display: "火山方舟"
    base_url: "https://ark.cn-beijing.volces.com/api/v3"
    api_key_env: "VOLCENGINE_API_KEY"
    protocol: "openai_compatible"
  aliyun:
    display: "阿里云百炼"
    base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"
    api_key_env: "DASHSCOPE_API_KEY"
    protocol: "openai_compatible"

# 参评模型（candidate）与裁判模型（judge / judge_cross）
models:
  # ---------- T0 旗舰级 ----------
  doubao-seed-2.1-pro:
    platform: volcengine
    tier: T0
    role: candidate
    snapshot: "doubao-seed-2.1-pro-0915"   # 以控制台接入点绑定版本为准
    context_window: 1048576
    verified: true
    pricing:                              # 阶梯价，按单次请求输入token数选档
      - {upto_input: 32768, input: 6.0, output: 30.0}
    cache_hit: 1.2

  qwen3.8-max:
    platform: aliyun
    tier: T0
    role: candidate
    snapshot: "qwen3.8-max-0902"
    context_window: 1048576
    verified: true
    pricing:
      - {upto_input: 1048576, input: 12.0, output: 36.0}   # 限时5折以控制台为准
    cache_hit: 2.4

  # ---------- T1 代码专项级 ----------
  doubao-seed-evolving:
    platform: volcengine
    tier: T1
    role: candidate
    snapshot: "doubao-seed-evolving-0915"
    context_window: 1048576
    verified: false                        # doubao-seed-code 下线后的继任候选，价格待核实
    pricing:
      - {upto_input: 32768, input: 6.0, output: 30.0}
    cache_hit: 1.2
    note: "Coding & Agent 场景定位；与旗舰同价，用于隔离模型专项化效应"

