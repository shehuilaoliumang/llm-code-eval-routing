<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LLM 代码生成能力评估 · 实时面板</title>
<style>
  :root {
    --bg: #f6f7fb; --card: #ffffff; --border: #e4e6ee;
    --text: #26221c; --muted: #6b6f7a;
    --purple: #534ab7; --green: #3b6d11; --coral: #993c1d; --blue: #185fa5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); line-height: 1.6;
    padding: clamp(14px, 3vw, 32px);
  }
  .page { max-width: 980px; margin: 0 auto; }
  h1 { font-size: clamp(18px, 3.5vw, 24px); font-weight: 600; color: var(--purple); }
  .sub { font-size: 13px; color: var(--muted); margin-top: 4px; }
  .card {
    background: var(--card); border: 1px solid var(--border); border-radius: 12px;
    padding: 16px 20px; margin-top: 16px;
  }
  .card h2 { font-size: 14px; font-weight: 600; margin-bottom: 10px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
  label.chk {
    display: inline-flex; align-items: center; gap: 6px; font-size: 13px;
    padding: 5px 10px; border: 1px solid var(--border); border-radius: 8px;
    cursor: pointer; background: var(--bg);
  }
  label.chk input { accent-color: var(--purple); }
  .btn {
    background: var(--purple); color: #fff; border: none; border-radius: 8px;
    padding: 9px 20px; font-size: 14px; cursor: pointer; font-weight: 500;
  }
  .btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .field { display: inline-flex; align-items: center; gap: 6px; font-size: 13px; }
  .field input, .field select {
    padding: 5px 8px; border: 1px solid var(--border); border-radius: 6px; font-size: 13px;
  }
  .field input[type=number] { width: 60px; }

  /* 穿梭框 chip */
  .chip-area {
    min-height: 40px; border: 1px dashed var(--border); border-radius: 10px;
    padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; background: #fbfbfe;
  }
  .chip-area.empty::after {
    content: "（空）"; color: var(--muted); font-size: 12px; align-self: center;
  }
  .mchip {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 5px 10px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 13px; cursor: pointer; background: #fff; user-select: none;
    transition: border-color 0.15s, box-shadow 0.15s;
  }
  .mchip:hover { border-color: var(--purple); box-shadow: 0 1px 4px rgba(83,74,183,0.15); }
  .mchip .tag { font-size: 10px; color: var(--muted); }
  .mchip.selected { border-color: var(--purple); background: #eeedfe; }
  .mchip .x {
    cursor: pointer; color: var(--muted); font-weight: 700; padding: 0 2px;
  }
  .mchip .x:hover { color: var(--coral); }
  .mchip.disabled { opacity: 0.35; cursor: not-allowed; }
  .mchip.disabled:hover { border-color: var(--border); box-shadow: none; }
  .group-title { font-size: 13px; font-weight: 600; margin: 12px 0 6px; }

  .progress-bar {
    height: 10px; background: var(--bg); border: 1px solid var(--border);
    border-radius: 6px; overflow: hidden; margin: 10px 0 6px;
  }
  .progress-bar .fill { height: 100%; background: var(--purple); width: 0; transition: width 0.2s; }
  .stat { display: flex; gap: 24px; flex-wrap: wrap; font-size: 13px; }
  .stat b { font-size: 20px; color: var(--purple); }
  .stat span { color: var(--muted); font-size: 12px; }
  #events {
    max-height: 360px; overflow-y: auto; font-family: "SF Mono", Consolas, monospace;
    font-size: 12px; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; background: var(--bg);
  }
  #events .ev { padding: 2px 0; border-bottom: 1px dashed var(--border); }
  #events .ev.ok { color: var(--green); }
  #events .ev.err { color: var(--coral); }
  .status-pill {
    display: inline-block; font-size: 12px; padding: 3px 12px; border-radius: 20px;
    background: var(--bg); border: 1px solid var(--border); color: var(--muted);
  }
  .status-pill.running { color: var(--purple); border-color: #cecbf6; background: #eeedfe; }
  .status-pill.done { color: var(--green); border-color: #c6ddab; background: #eaf3de; }
  .status-pill.error { color: var(--coral); border-color: #f5c4b3; background: #faece7; }
</style>
</head>
<body>
<div class="page">
  <h1>LLM 代码生成能力评估 · 实时面板</h1>
  <div class="sub">选模型 → 连通测试 → 启动评估 → 实时看每道题判分进度（SSE 推送）</div>

  <div class="card">
    <h2>① 已选模型（<span id="selCount">0</span>）<span style="font-size:12px;color:var(--muted);font-weight:400;">· 点 × 移回下方</span></h2>
    <div class="chip-area" id="selectedArea"></div>
    <div style="margin-top:12px;">
      <button class="btn" id="loadPlatformBtn" onclick="loadPlatformModels()" style="background:#6b6f7a;">从平台加载全部模型</button>
      <button class="btn" id="testBtn" onclick="testConnectivity()" style="background:#185fa5;margin-left:8px;">连通测试</button>
      <span style="font-size:12px;color:var(--muted);margin-left:8px;" id="platformInfo"></span>
    </div>
  </div>

  <div class="card" id="optionalCard" style="display:none;">
    <h2>② 可选模型（点击加入上方）</h2>
    <div class="group-title">火山方舟</div>
    <div class="chip-area" id="volcArea"></div>
    <div class="group-title">阿里云百炼</div>
    <div class="chip-area" id="aliArea"></div>
  </div>

  <div class="card">
    <h2>③ 选择任务难度</h2>
    <div class="row" id="diffList">
      <label class="chk"><input type="checkbox" class="diff" value="L1" checked> L1 入门</label>
      <label class="chk"><input type="checkbox" class="diff" value="L2" checked> L2 进阶</label>
      <label class="chk"><input type="checkbox" class="diff" value="L3" checked> L3 高级</label>
      <label class="chk"><input type="checkbox" class="diff" value="L4" checked> L4 专家</label>
    </div>
    <div class="row" style="margin-top:10px;">
      <div class="field">每模型次数 <input type="number" id="runs" value="1" min="1" max="3"></div>
      <div class="field">并发 <input type="number" id="workers" value="6" min="1" max="12"></div>
      <button class="btn" id="startBtn" onclick="startEval()">启动评估</button>
      <span class="status-pill" id="statusPill">空闲</span>
    </div>
  </div>

  <div class="card">
    <h2>④ 实时进度</h2>
    <div class="progress-bar"><div class="fill" id="fill"></div></div>
    <div class="stat">
      <div><b id="statDone">0</b><span> / </span><b id="statTotal">0</b> 完成</div>
      <div>总成本 <b id="statCost">¥0.00</b></div>
      <div>平均质量 <b id="statQuality">—</b></div>
      <div>已用时 <b id="statElapsed">0s</b></div>
    </div>
    <div id="events" style="margin-top:10px;">等待启动…</div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);
let es = null;
let allTasks = [];
let costSum = 0, qualitySum = 0, qualityCnt = 0, startTime = 0;

// 穿梭框状态：selectedSet = 已选模型 ID；modelMeta = id -> {platform, verified}
let selectedSet = new Set();
let modelMeta = {};

function chipHtml(id, meta, selected) {
  const platTag = meta.platform === 'volcengine' ? '方舟' : '百炼';
  const unverified = meta.verified === false ? '<span class="tag">未配置</span>' : '';
  if (selected) {
    return `<span class="mchip selected" data-id="${id}">${id} ${unverified}
      <span class="x" onclick="deselectModel('${id}')" title="取消选择">×</span></span>`;
  }
  return `<span class="mchip" data-id="${id}" onclick="selectModel('${id}')">${id} ${unverified}</span>`;
}

function renderSelected() {
  const area = $('selectedArea');
  area.innerHTML = [...selectedSet].map(id => chipHtml(id, modelMeta[id] || {}, true)).join('');
  area.classList.toggle('empty', selectedSet.size === 0);
  $('selCount').textContent = selectedSet.size;
}

function renderOptional() {
  const volc = [], ali = [];
  for (const [id, meta] of Object.entries(modelMeta)) {
    if (selectedSet.has(id)) continue;
    if (meta.available === false) continue;  // 连通测试失败的不再展示
    (meta.platform === 'volcengine' ? volc : ali).push(id);
  }
  $('volcArea').innerHTML = volc.map(id => chipHtml(id, modelMeta[id], false)).join('');
  $('aliArea').innerHTML = ali.map(id => chipHtml(id, modelMeta[id], false)).join('');
  $('volcArea').classList.toggle('empty', volc.length === 0);
  $('aliArea').classList.toggle('empty', ali.length === 0);
}

function selectModel(id) {
  selectedSet.add(id);
  renderSelected();
  renderOptional();
}

function deselectModel(id) {
  selectedSet.delete(id);
  renderSelected();
  renderOptional();
}

async function loadModels() {
  const r = await fetch('/api/models'); const d = await r.json();
  for (const m of d.models) {
    modelMeta[m.id] = { platform: m.platform, verified: true };
    selectedSet.add(m.id);  // 已验证候选默认选中
  }
  renderSelected();
  renderOptional();
}

async function loadTasks() {
  const r = await fetch('/api/tasks'); const d = await r.json();
  allTasks = d.tasks;
}

async function loadPlatformModels() {
  const btn = $('loadPlatformBtn');
  btn.disabled = true; btn.textContent = '加载中…';
  let d;
  try {
    const r = await fetch('/api/models/available?refresh=true');
    d = await r.json();
  } catch (e) {
    btn.disabled = false; btn.textContent = '从平台加载全部模型';
    $('platformInfo').textContent = '加载失败：' + e;
    return;
  }
  btn.disabled = false; btn.textContent = '从平台加载全部模型';

  const verified = new Set(d.verified_ids || []);
  let added = 0;
  const addGroup = (platform, models) => {
    for (const id of (models || [])) {
      if (verified.has(id) || modelMeta[id]) continue;  // 跳过已验证候选和已加载
      modelMeta[id] = { platform: platform, verified: false };
      added++;
    }
  };
  addGroup('volcengine', d.volcengine);
  addGroup('aliyun', d.aliyun);
  $('optionalCard').style.display = 'block';
  renderOptional();
  $('platformInfo').textContent = `已加载 ${added} 个平台模型（点「连通测试」过滤不可用的）`;
  if (d.errors && d.errors.length) {
    $('platformInfo').textContent += ' | ' + d.errors.join('；');
  }
}

async function testConnectivity() {
  const btn = $('testBtn');
  const models = [];
  for (const [id, meta] of Object.entries(modelMeta)) {
    if (!selectedSet.has(id)) models.push({ platform: meta.platform, id });
  }
  if (!models.length) {
    $('platformInfo').textContent = '没有待测的可选模型（请先「从平台加载全部模型」）';
    return;
  }
  btn.disabled = true; btn.textContent = '测试中…';
  $('platformInfo').textContent = `正在连通测试 ${models.length} 个模型（并发 5，约需数十秒）…`;
  try {
    const r = await fetch('/api/models/test', {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ models, workers: 5 }),
    });
    const d = await r.json();
    const results = d.results || {};
    let avail = 0, unavail = 0;
    for (const [id, res] of Object.entries(results)) {
      if (!modelMeta[id]) continue;
      if (res.available) {
        modelMeta[id].available = true; avail++;
      } else {
        modelMeta[id].available = false; modelMeta[id].error = res.error; unavail++;
      }
    }
    renderOptional();
    $('platformInfo').textContent = `测试完成：${avail} 个可用、${unavail} 个不可用（不可用的已移除）`;
  } catch (e) {
    $('platformInfo').textContent = '测试失败：' + e;
  } finally {
    btn.disabled = false; btn.textContent = '连通测试';
  }
}

function selectedDiffs() {
  return [...document.querySelectorAll('.diff:checked')].map(c => c.value);
}

async function startEval() {
  const models = [...selectedSet];
  const diffs = selectedDiffs();
  const taskIds = allTasks.filter(t => diffs.includes(t.difficulty)).map(t => t.task_id);
  if (!models.length || !taskIds.length) { alert('请至少选择一个模型和一个难度'); return; }

  $('startBtn').disabled = true;
  setStatus('running', '运行中');
  costSum = 0; qualitySum = 0; qualityCnt = 0; startTime = Date.now();
  $('events').innerHTML = '';
  $('statCost').textContent = '¥0.00'; $('statQuality').textContent = '—';

  openSSE();
  await fetch('/api/eval', {
    method: 'POST', headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ models, task_ids: taskIds,
                          runs: +$('runs').value, workers: +$('workers').value }),
  });
}

function openSSE() {
  if (es) es.close();
  es = new EventSource('/api/eval/stream');
  es.addEventListener('status', e => {
    const d = JSON.parse(e.data);
    if (d.status === 'done') { setStatus('done', '完成'); $('startBtn').disabled = false; }
    if (d.status === 'error') { setStatus('error', '出错'); $('startBtn').disabled = false; }
  });
  es.addEventListener('progress', e => {
    const d = JSON.parse(e.data);
    $('statDone').textContent = d.done; $('statTotal').textContent = d.total;
    $('fill').style.width = (d.total ? d.done / d.total * 100 : 0) + '%';
    $('statElapsed').textContent = Math.round((Date.now() - startTime) / 1000) + 's';
    if (d.cost_yuan != null) { costSum += d.cost_yuan; $('statCost').textContent = '¥' + costSum.toFixed(4); }
    if (d.quality_total != null) { qualitySum += d.quality_total; qualityCnt++; $('statQuality').textContent = (qualitySum / qualityCnt).toFixed(1); }
    const cls = d.status === 'OK' ? 'ok' : 'err';
    const div = document.createElement('div');
    div.className = 'ev ' + cls;
    div.textContent = `[${d.done}/${d.total}] ${d.task_id} ${d.model} run${d.run} 质量=${d.quality_total ?? '—'} 成本=¥${d.cost_yuan ?? 0} 延迟=${d.latency_seconds ?? 0}s`;
    $('events').prepend(div);
  });
}

function setStatus(s, text) {
  const p = $('statusPill'); p.textContent = text; p.className = 'status-pill ' + s;
}

loadModels(); loadTasks();
</script>
</body>
</html>
